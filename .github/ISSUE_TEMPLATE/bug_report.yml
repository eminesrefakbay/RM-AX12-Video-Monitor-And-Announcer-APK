name: Bug report
description: Something does not work the way it should
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. AX-HUD is an independent project and is not affiliated with RadioMaster. Problems with the radio itself,
        its firmware or the stock app belong with RadioMaster (https://github.com/Radiomaster-RC/AX12).

        **The fastest way to help me** is the report the app collects: *Settings > System > Diagnostics and bug report...*, then *Copy*.
        It holds the versions, the device, the state of the radio link and the last events. It has no GPS positions in it.
  - type: input
    id: version
    attributes:
      label: AX-HUD version
      description: Shown in Settings > System > Updates, and in the diagnostics report.
      placeholder: "1.12.0"
    validations:
      required: true
  - type: input
    id: radio
    attributes:
      label: Radio and Android build
      placeholder: "AX12, Android 9, build number from Android's About screen"
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - Video and the camera
        - HUD overlays and cards
        - Speech and sound rules
        - Warnings and checks
        - Dashboard
        - Flight logs and replay
        - Approval window, landing and link loss
        - Antenna tracker (experimental)
        - Settings
        - Language and texts
        - Updates
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: textarea
    id: steps
    attributes:
      label: How can I see it myself?
      placeholder: |
        1. Open Settings
        2. ...
  - type: textarea
    id: report
    attributes:
      label: Diagnostics report
      description: Paste it here. Look through it first and remove anything you do not want to share.
      render: text
  - type: checkboxes
    id: before
    attributes:
      label: Before you send
      options:
        - label: I searched the existing issues for the same problem.
        - label: I looked through what I pasted and removed anything private (names, positions).
