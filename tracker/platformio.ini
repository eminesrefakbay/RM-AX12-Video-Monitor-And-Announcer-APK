; AX-HUD antenna tracker: an ESP32 with two servos, a GPS and a compass.
; Build and flash with PlatformIO:  pio run -t upload     (monitor: pio device monitor)
; The platform is pinned to the Arduino core 2.x that this code was written for (the LEDC and NimBLE calls differ in core 3).
[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1
    mikalhart/TinyGPSPlus@^1.0.3
build_flags = -DCORE_DEBUG_LEVEL=0
